      <defs>
        <linearGradient id="sp-tile-fill" gradientUnits="userSpaceOnUse" x1="100" y1="100" x2="924" y2="924">
          <stop class="sp-stop-1" offset="0"/>
          <stop class="sp-stop-2" offset="1"/>
        </linearGradient>
      </defs>
      <g class="sp-ride">
        <path class="sp-fin" d="M92 172l8 14 7-14Z"/>
        <path class="sp-board" d="M8 164c30-16 152-16 186-3-30 15-154 17-186 3Z"/>
        <g class="sp-tile">

  <p class="sp-name">GitSense</p>
  <p class="sp-cmd" aria-hidden="true">
    <!-- splash:lines -->
    <!-- Three commands typed in turn. --n is each one's length in characters. -->
    <span class="sp-type sp-type-1" style="--n:19">$ git fetch --swell</span>
    <span class="sp-type sp-type-2" style="--n:23">$ git rebase --hang-ten</span>
    <span class="sp-type sp-type-3" style="--n:24">$ git merge --no-wipeout</span>
    <!-- /splash:lines -->
  </p>
</div>
<div class="chrome-bar" aria-hidden="true"></div>
<header id="topbar">
  <nav id="tabs" class="tabs" aria-label="Open repositories"></nav>
  <div class="topbar-right">
    <div id="topbar-actions" class="topbar-actions"></div>
  </div>
</header>
<main id="view"></main>
<footer id="statusbar">
  <div id="status-activity" class="status-activity" role="status" aria-live="polite"></div>
  <div id="status-right" class="status-right"></div>
</footer>
<div class="chrome-bar chrome-bar-bottom" aria-hidden="true"></div>
<div id="overlay-root"></div>
